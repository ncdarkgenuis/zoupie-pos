<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopFlow-Pro - Dashboard Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="sidebar-brand">
                    <h2>ShopFlow-Pro</h2>
                </div>
                <nav class="sidebar-menu">
                    <div class="sidebar-item">📊 Terminal Floor</div>
                </nav>
            </div>
            <button onclick="localStorage.clear(); window.location.href='/'" class="sidebar-logout">Logout</button>
        </aside>

        <main class="main-content">
            <header>
                <h1>Workspace Control Control</h1>
                <div id="user-display" style="font-weight: 600; color: var(--text-muted);">Terminal Active</div>
            </header>

            <div class="metrics-grid">
                <div class="card">
                    <h3>Total Revenue</h3>
                    <p>₵<span id="total-revenue">0.00</span></p>
                </div>
                <div class="card">
                    <h3>Net Performance Profit</h3>
                    <p>₵<span id="net-profit">0.00</span></p>
                </div>
            </div>

            <div class="floor-layout">
                <section class="inventory-section">
                    <h2>Active Stock Inventory</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Item Name</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table-body"></tbody>
                    </table>
                </section>

                <section class="checkout-section">
                    <h2>Terminal POS Cart</h2>
                    <div id="cart-container"></div>
                    <h3>
                        <span>Grand Total:</span>
                        <span>₵<span id="cart-grand-total">0.00</span></span>
                    </h3>
                    <button class="btn-primary" onclick="processBulkCashout()">Finalize Bulk Cashout</button>
                </section>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
