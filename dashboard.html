<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopFlow-Pro Terminal Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <header>
            <h1>ShopFlow-Pro Workspace Control</h1>
            <button onclick="localStorage.clear(); window.location.href='/'" class="btn-logout">Logout</button>
        </header>

        <div class="metrics-grid">
            <div class="card"><h3>Total Revenue</h3><p>₵<span id="total-revenue">0.00</span></p></div>
            <div class="card"><h3>Net Performance Profit</h3><p>₵<span id="net-profit">0.00</span></p></div>
        </div>

        <main class="floor-layout">
            <section class="inventory-section">
                <h2>Active Stock Inventory</h2>
                <table>
                    <thead><tr><th>Item Name</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead>
                    <tbody id="inventory-table-body"></tbody>
                </table>
            </section>

            <section class="checkout-section">
                <h2>Terminal POS Cart</h2>
                <div id="cart-container"></div>
                <h3>Grand Total: ₵<span id="cart-grand-total">0.00</span></h3>
                <button class="btn-primary" onclick="processBulkCashout()">Finalize Bulk Cashout</button>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
