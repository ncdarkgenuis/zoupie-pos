<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zoupie Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { --p: #2563eb; --s: #10b981; --d: #0f172a; }
        body { font-family: system-ui; background: #f8fafc; margin: 0; }
        nav { background: var(--d); padding: 15px; display: flex; gap: 20px; color: white; position: sticky; top: 0; z-index: 1000; }
        nav b { cursor: pointer; padding: 5px 10px; border-radius: 4px; }
        .container { padding: 20px; max-width: 1000px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .page { display: none; } .active { display: block; }
        .bulk-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1.5fr; gap: 10px; margin-bottom: 10px; }
        input, select, button { padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; width: 100%; box-sizing: border-box; }
        button { background: var(--p); color: white; border: none; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .btn-print { background: #6366f1; margin-top: 15px; }
    </style>
</head>
<body>

<nav>
    <b onclick="go('inv')">📦 Inventory</b>
    <b onclick="go('pos')">🛒 Cashier</b>
    <b onclick="go('ins')">📈 Insights</b>
</nav>

<div class="container">
    <div id="inv" class="page active">
        <div class="card">
            <h3>Add Stock (Bulk)</h3>
            <div id="bulk-box">
                <div class="bulk-row">
                    <input type="text" class="n" placeholder="Item Name"><input type="number" class="c" placeholder="Cost"><input type="number" class="p" placeholder="Price"><input type="number" class="q" placeholder="Qty"><input type="date" class="e">
                </div>
            </div>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button onclick="addRow()" style="background:#64748b">+ Row</button>
                <button onclick="saveInv()" style="background:var(--s)">Save All</button>
            </div>
        </div>
        <div class="card">
            <table><thead><tr><th>Item</th><th>Price</th><th>Stock</th></tr></thead><tbody id="inv-table"></tbody></table>
        </div>
    </div>

    <div id="pos" class="page">
        <div class="stat-grid">
            <div class="card">
                <h3>Basket</h3>
                <select id="sel"></select>
                <input type="number" id="sq" value="1" style="margin:10px 0;">
                <button onclick="addCart()">Add to Cart</button>
            </div>
            <div class="card">
                <h3>Total</h3>
                <div id="cart-list"></div><hr>
                <h2 id="total-price">₵0.00</h2>
                <button onclick="checkout()" style="background:var(--s)">Confirm Sale & Print Receipt</button>
            </div>
        </div>
    </div>

    <div id="ins" class="page">
        <div class="stat-grid">
            <div class="card"><h4>Revenue</h4><h1 id="rev">₵0.00</h1></div>
            <div class="card" style="color:var(--s)"><h4>Profit</h4><h1 id="prof">₵0.00</h1></div>
        </div>
        <div class="card">
            <h3>Top Sellers</h3><div id="top"></div>
            <button onclick="generatePDF()" class="btn-print">🖨️ Download Sales Report (PDF)</button>
        </div>
    </div>
</div>

<script>
    const email = localStorage.getItem('userEmail');
    let cart = [];

    function go(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'ins') loadInsights();
        loadInventory();
    }

    function addRow() {
        const div = document.createElement('div');
        div.className = 'bulk-row';
        div.innerHTML = `<input type="text" class="n" placeholder="Name"><input type="number" class="c" placeholder="Cost"><input type="number" class="p" placeholder="Price"><input type="number" class="q" placeholder="Qty"><input type="date" class="e">`;
        document.getElementById('bulk-box').appendChild(div);
    }

    async function loadInventory() {
        const res = await fetch(`/inventory/${email}`); // Localhost removed
        const data = await res.json();
        document.getElementById('inv-table').innerHTML = data.map(i => `<tr><td>${i.name}</td><td>₵${i.price}</td><td>${i.stock_quantity}</td></tr>`).join('');
        document.getElementById('sel').innerHTML = data.map(i => `<option value="${i.id}" data-name="${i.name}" data-price="${i.price}">${i.name}</option>`).join('');
    }

    async function saveInv() {
        const rows = document.querySelectorAll('.bulk-row');
        const items = Array.from(rows).map(r => ({
            name: r.querySelector('.n').value, cost_price: r.querySelector('.c').value,
            price: r.querySelector('.p').value, qty: r.querySelector('.q').value, e: r.querySelector('.e').value
        })).filter(i => i.name !== "");
        await fetch('/inventory/add-bulk', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, items }) });
        loadInventory();
    }

    function addCart() {
        const s = document.getElementById('sel');
        const o = s.options[s.selectedIndex];
        cart.push({ id: s.value, name: o.dataset.name, price: parseFloat(o.dataset.price), qtySold: parseInt(document.getElementById('sq').value) });
        renderCart();
    }

    function renderCart() {
        let t = 0;
        document.getElementById('cart-list').innerHTML = cart.map(i => { t += (i.price * i.qtySold); return `<div>${i.name} x${i.qtySold} - ₵${(i.price * i.qtySold).toFixed(2)}</div>`; }).join('');
        document.getElementById('total-price').innerText = `₵${t.toFixed(2)}`;
    }

    async function checkout() {
        if (cart.length === 0) return;
        printReceipt();
        await fetch('/inventory/cashout-bulk', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, cart }) });
        cart = []; renderCart(); loadInventory(); alert("Sold!");
    }

    function printReceipt() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'mm', format: [80, 150] });
        doc.setFont("helvetica");
        doc.setFontSize(14); doc.text("ZOUPIE POS", 40, 10, { align: 'center' });
        doc.setFontSize(8); doc.text(`Shop: ${email}`, 40, 15, { align: 'center' });
        doc.text("------------------------------------------", 40, 25, { align: 'center' });
        let y = 32; let total = 0;
        cart.forEach(item => {
            const sub = item.price * item.qtySold;
            doc.text(`${item.name} x${item.qtySold}`, 10, y);
            doc.text(`${sub.toFixed(2)}`, 70, y, { align: 'right' });
            total += sub; y += 7;
        });
        doc.text(`TOTAL: ${total.toFixed(2)}`, 70, y + 10, { align: 'right' });
        doc.save(`Receipt_${Date.now()}.pdf`);
    }

    async function loadInsights() {
        const res = await fetch(`/analytics/${email}`);
        const d = await res.json();
        document.getElementById('rev').innerText = `₵${d.revenue}`;
        document.getElementById('prof').innerText = `₵${d.profit}`;
        document.getElementById('top').innerHTML = d.topItems.map(i => `<p><b>${i[0]}</b>: ${i[1]} sold</p>`).join('');
    }

    async function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const res = await fetch(`/analytics/${email}`);
        const data = await res.json();
        doc.text("Zoupie POS Sales Report", 14, 22);
        doc.autoTable({ startY: 30, head: [['Product', 'Qty']], body: data.topItems });
        doc.save(`Report.pdf`);
    }

    window.onload = loadInventory;
</script>
</body>
</html>
