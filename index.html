<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopFlow POS & Inventory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Shop<span>Flow</span></div>
        <ul class="nav-links">
            <li>Dashboard</li>
            <li>Inventory</li>
        </ul>
    </nav>

    <main class="container">
        <div class="stats-bar">
            <div class="stat-card">
                <small>Today's Sales</small>
                <h2 id="stat-revenue">GH₵ 0.00</h2>
            </div>
            <div class="stat-card">
                <small>Transactions Today</small>
                <h2 id="stat-transactions">0</h2>
            </div>
            <div class="stat-card">
                <small>Items Sold Today</small>
                <h2 id="stat-items">0</h2>
            </div>
        </div>

        <header class="header">
            <h1>Product Management</h1>
            <div class="header-actions">
                <input type="text" id="search-bar" placeholder="Search products..." class="search-input">
                <button id="add-btn">+ Add New Item</button>
            </div>
        </header>

        <div class="main-layout">
            <section class="inventory-section">
                <div id="low-stock-alert" class="alert-container" style="display: none;">
                    <div class="alert-header">⚠️ <h3>Low Stock Alerts</h3></div>
                    <ul id="alert-list" class="alert-list"></ul>
                </div>
                <div class="item-grid" id="item-grid"></div>
            </section>

            <aside class="cash-out-sidebar">
                <h3>Active Bill</h3>
                <div id="bill-items" class="bill-items">
                    <p class="empty-msg">No items selected</p>
                </div>
                <div class="bill-footer">
                    <div class="total-row">
                        <span>Total:</span>
                        <span id="bill-total">GH₵ 0.00</span>
                    </div>
                    <button id="checkout-btn" class="checkout-btn">Complete Cash Out</button>
                </div>
            </aside>
        </div>

        <section class="history-section">
            <div class="history-header">
             <h2>Recent Transactions</h2>
                <div class="history-actions">
                    <button id="export-history" class="text-btn-success">📥 Download Sales (CSV)</button>
                    <button id="clear-history" class="text-btn-danger">Clear History</button>
                </div>
            </div>
            <div class="history-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Items Sold</th>
                            <th>Total Amount</th>
                        </tr>
                    </thead>
                    <tbody id="history-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="modal-overlay" class="overlay">
        <div class="modal">
            <h2>Add New Product</h2>
            <form id="add-item-form">
                <input type="hidden" id="edit-item-id">
    
                <div class="form-group"><label>Product Name</label><input type="text" id="item-name" required></div>
                <div class="form-group"><label>Price (GH₵)</label><input type="number" id="item-price" step="0.01" required></div>
                <div class="form-group"><label>Stock Level</label><input type="number" id="item-stock" required></div>
    
                <div class="modal-btns">
                <button type="submit" class="save-btn" id="save-btn-text">Save Product</button>
                <button type="button" id="close-modal" class="cancel-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
